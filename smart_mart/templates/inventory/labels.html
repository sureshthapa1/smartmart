<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Labels — {{ shop.shop_name if shop else 'Smart Mart' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    /* ── Screen UI ─────────────────────────────────────────────────────── */
    body { background:#f1f5f9; font-family:'Segoe UI',Arial,sans-serif; }
    .top-bar { background:#0f172a; padding:.6rem 1.2rem; color:#fff; display:flex; align-items:center; gap:1rem; }
    .top-bar a { color:#94a3b8; text-decoration:none; font-size:.85rem; }
    .section-card { background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:1.5rem; margin-bottom:1.5rem; }
    .size-btn { border:2px solid #e2e8f0; border-radius:8px; padding:.35rem .8rem; cursor:pointer; font-size:.8rem; font-weight:600; background:#f8fafc; }
    .size-btn.active { border-color:#6366f1; background:#eef2ff; color:#6366f1; }
    .prow { border:1px solid #e2e8f0; border-radius:8px; padding:.4rem .75rem; margin-bottom:.3rem; display:flex; align-items:center; gap:.6rem; cursor:pointer; }
    .prow:hover { background:#f8fafc; }
    .qty-inp { width:55px; border:1px solid #e2e8f0; border-radius:6px; padding:.15rem .35rem; font-size:.8rem; text-align:center; }

    /* ── Label — shared base (screen + print) ─────────────────────────── */
    .label {
      box-sizing: border-box;
      display: flex;
      overflow: hidden;
      page-break-inside: avoid;
      break-inside: avoid;
      background: #fff;
      border: 1px solid #000;
      font-family: Arial, 'Segoe UI', sans-serif;
    }

    /* ── 50×25mm — horizontal: QR left, text right ─────────────────── */
    .label.s50 {
      width: 50mm;
      height: 25mm;
      padding: 1mm;
      flex-direction: row;
      align-items: center;
      gap: 1mm;
    }
    .label.s50 .l-qr   { flex-shrink: 0; }
    .label.s50 .l-qr img { width: 15mm; height: 15mm; display: block; }
    .label.s50 .l-text { flex: 1; display:flex; flex-direction:column; justify-content:center; overflow:hidden; }
    .label.s50 .l-shop { font-size: 4.5pt; font-weight:700; color:#000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2; }
    .label.s50 .l-name { font-size: 6.5pt; font-weight:900; color:#000; line-height:1.2; word-break:break-word; margin:.3mm 0; }
    .label.s50 .l-price{ font-size: 10pt;  font-weight:900; color:#000; line-height:1; }
    .label.s50 .l-mrp  { font-size: 4pt;   color:#000; line-height:1.2; }
    .label.s50 .l-sku  { font-size: 4pt;   color:#000; letter-spacing:.03em; }
    .label.s50 .l-cat  { font-size: 4pt;   color:#000; }

    /* ── 40×25mm ────────────────────────────────────────────────────── */
    .label.s40 { width:40mm; height:25mm; padding:1mm; flex-direction:row; align-items:center; gap:1mm; }
    .label.s40 .l-qr img { width:13mm; height:13mm; display:block; }
    .label.s40 .l-text { flex:1; display:flex; flex-direction:column; justify-content:center; overflow:hidden; }
    .label.s40 .l-shop { font-size:4pt; font-weight:700; color:#000; }
    .label.s40 .l-name { font-size:6pt; font-weight:900; color:#000; word-break:break-word; margin:.2mm 0; }
    .label.s40 .l-price{ font-size:9pt; font-weight:900; color:#000; line-height:1; }
    .label.s40 .l-mrp  { font-size:3.5pt; color:#000; }
    .label.s40 .l-sku  { font-size:3.5pt; color:#000; }
    .label.s40 .l-cat  { font-size:3.5pt; color:#000; }

    /* ── 60×35mm ────────────────────────────────────────────────────── */
    .label.s60 { width:60mm; height:35mm; padding:1.5mm; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .label.s60 .l-qr img { width:18mm; height:18mm; display:block; }
    .label.s60 .l-shop { font-size:5pt; font-weight:700; color:#000; }
    .label.s60 .l-name { font-size:8pt; font-weight:900; color:#000; margin:.4mm 0; word-break:break-word; }
    .label.s60 .l-price{ font-size:12pt; font-weight:900; color:#000; line-height:1; }
    .label.s60 .l-mrp  { font-size:4.5pt; color:#000; }
    .label.s60 .l-sku  { font-size:4.5pt; color:#000; }
    .label.s60 .l-cat  { font-size:4.5pt; color:#000; }

    /* ── 80×45mm ────────────────────────────────────────────────────── */
    .label.s80 { width:80mm; height:45mm; padding:2mm; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .label.s80 .l-qr img { width:24mm; height:24mm; display:block; }
    .label.s80 .l-shop { font-size:6pt; font-weight:700; color:#000; }
    .label.s80 .l-name { font-size:10pt; font-weight:900; color:#000; margin:.5mm 0; word-break:break-word; }
    .label.s80 .l-price{ font-size:14pt; font-weight:900; color:#000; line-height:1; }
    .label.s80 .l-mrp  { font-size:5pt; color:#000; }
    .label.s80 .l-sku  { font-size:5pt; color:#000; }
    .label.s80 .l-cat  { font-size:5pt; color:#000; }

    /* ── 80mm roll ──────────────────────────────────────────────────── */
    .label.sroll { width:76mm; padding:1.5mm 2mm; flex-direction:row; align-items:center; gap:2mm; }
    .label.sroll .l-qr img { width:22mm; height:22mm; display:block; }
    .label.sroll .l-text { flex:1; display:flex; flex-direction:column; justify-content:center; }
    .label.sroll .l-shop { font-size:5.5pt; font-weight:700; color:#000; }
    .label.sroll .l-name { font-size:8.5pt; font-weight:900; color:#000; margin:.4mm 0; word-break:break-word; }
    .label.sroll .l-price{ font-size:13pt; font-weight:900; color:#000; line-height:1; }
    .label.sroll .l-mrp  { font-size:4.5pt; color:#000; }
    .label.sroll .l-sku  { font-size:4.5pt; color:#000; }
    .label.sroll .l-cat  { font-size:4.5pt; color:#000; }

    /* ── Print ─────────────────────────────────────────────────────── */
    @media print {
      .no-print, .top-bar, .container-fluid { display:none !important; }
      body   { margin:0 !important; padding:0 !important; background:#fff !important; }
      #printArea { display:block !important; }

      #printSheet {
        display: flex !important;
        flex-wrap: wrap;
        gap: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        background: #fff !important;
        align-content: flex-start;
      }

      /* Force exact dimensions and pure black on print */
      .label {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color: #000 !important;
        background: #fff !important;
        border: 1px solid #000 !important;
      }
      .label * { color: #000 !important; }

      @page { size: 50mm 25mm; margin: 0; }
    }
  </style>
</head>
<body>

<div class="top-bar no-print">
  <a href="{{ url_for('inventory.list_products') }}"><i class="bi bi-arrow-left me-1"></i>Inventory</a>
  <span style="color:#fff;font-weight:700;">Print Labels</span>
  <button onclick="doPrint()" class="btn btn-sm ms-auto"
          style="background:#6366f1;color:#fff;border:none;border-radius:8px;">
    <i class="bi bi-printer me-1"></i>Print Labels
  </button>
</div>

<div class="container-fluid py-3 no-print" style="max-width:1100px;">
  <div class="row g-3">

    <!-- Product selector -->
    <div class="col-lg-5">
      <div class="section-card">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h6 class="fw-bold mb-0"><i class="bi bi-box-seam me-2 text-primary"></i>Select Products</h6>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="selectAll()">All</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearAll()">None</button>
          </div>
        </div>
        <input type="text" id="prodSearch" class="form-control form-control-sm mb-2"
               placeholder="Search…" oninput="filterProds()">
        <div id="prodList" style="max-height:430px;overflow-y:auto;">
          {% for p in products %}
          <label class="prow" data-name="{{ p.name|lower }}" data-cat="{{ (p.category or '')|lower }}">
            <input type="checkbox" class="pcb" value="{{ p.id }}"
                   {% if p.id in selected_ids %}checked{% endif %}
                   onchange="onCheck(this)">
            <div class="flex-grow-1">
              <div style="font-size:.82rem;font-weight:600;">{{ p.name }}</div>
              <div style="font-size:.7rem;color:#64748b;">{{ p.sku }} · NPR {{ "%.0f"|format(p.selling_price|float) }}</div>
            </div>
            <input type="number" class="qty-inp" min="1" max="200" value="1"
                   title="Copies" onclick="event.stopPropagation()"
                   oninput="rebuild()" data-pid="{{ p.id }}">
          </label>
          {% endfor %}
        </div>
      </div>
    </div>

    <!-- Options + preview -->
    <div class="col-lg-7">
      <div class="section-card mb-3">
        <h6 class="fw-bold mb-3"><i class="bi bi-sliders me-2 text-primary"></i>Options</h6>

        <!-- Size buttons -->
        <div class="d-flex flex-wrap gap-2 mb-3">
          <span class="text-muted small fw-semibold align-self-center">Size:</span>
          <button class="size-btn" data-s="s40"   onclick="setSize('s40')">40×25mm</button>
          <button class="size-btn active" data-s="s50" onclick="setSize('s50')">★ 50×25mm</button>
          <button class="size-btn" data-s="s60"   onclick="setSize('s60')">60×35mm</button>
          <button class="size-btn" data-s="s80"   onclick="setSize('s80')">80×45mm</button>
          <button class="size-btn" data-s="sroll" onclick="setSize('sroll')">🖨 Roll (80mm)</button>
        </div>

        <!-- Print tip -->
        <div id="tip" class="alert alert-info py-2 px-3 mb-3" style="font-size:.78rem;">
          <i class="bi bi-printer me-1"></i>
          <strong>Print dialog settings:</strong>
          Paper = <strong id="tipPaper">50mm × 25mm</strong> &nbsp;|&nbsp;
          Margins = <strong>None</strong> &nbsp;|&nbsp;
          Uncheck <strong>Headers &amp; footers</strong>
        </div>

        <!-- Toggles -->
        <div class="d-flex flex-wrap gap-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="chkQr" checked onchange="rebuild()">
            <label class="form-check-label small" for="chkQr">QR code</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="chkShop" checked onchange="rebuild()">
            <label class="form-check-label small" for="chkShop">Shop name</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="chkCat" onchange="rebuild()">
            <label class="form-check-label small" for="chkCat">Category</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="chkSku" onchange="rebuild()">
            <label class="form-check-label small" for="chkSku">SKU</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="chkMrp" checked onchange="rebuild()">
            <label class="form-check-label small" for="chkMrp">MRP line</label>
          </div>
        </div>
      </div>

      <!-- Preview -->
      <div class="section-card">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h6 class="fw-bold mb-0"><i class="bi bi-eye me-2 text-primary"></i>Preview</h6>
          <span id="cntBadge" class="badge bg-secondary">0 labels</span>
        </div>
        <div style="background:#e2e8f0;border-radius:8px;padding:6px;min-height:100px;overflow:auto;max-height:400px;">
          <div id="previewSheet" style="display:flex;flex-wrap:wrap;gap:2mm;padding:2mm;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Hidden print-only area -->
<div id="printArea" style="display:none;">
  <div id="printSheet"></div>
</div>

<script>
  const SHOP = {{ (shop.shop_name if shop else 'Smart Mart') | tojson }};

  // Pre-loaded QR data from server (only when products submitted via POST)
  const PRE_QR = {
    {% for item in label_data %}
    {{ item.id }}: {{ item.barcode_b64 | tojson }}{% if not loop.last %},{% endif %}
    {% endfor %}
  };

  // All products
  const PRODS = {
    {% for p in products %}
    {{ p.id }}: {
      name: {{ p.name | tojson }},
      sku:  {{ p.sku | tojson }},
      price: {{ p.selling_price | float }},
      cat:  {{ (p.category or '') | tojson }}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  };

  // QR cache: pid → base64 data URI
  const QR_CACHE = { ...PRE_QR };

  let curSize = 's50';

  const TIP_PAPER = {
    s40:'40mm × 25mm', s50:'50mm × 25mm',
    s60:'60mm × 35mm', s80:'80mm × 45mm', sroll:'80mm wide (roll)'
  };

  // page sizes to inject dynamically before printing
  const PAGE_CSS = {
    s40:   '@page{size:40mm 25mm;margin:0}',
    s50:   '@page{size:50mm 25mm;margin:0}',
    s60:   '@page{size:60mm 35mm;margin:0}',
    s80:   '@page{size:80mm 45mm;margin:0}',
    sroll: '@page{size:80mm auto;margin:1mm}'
  };

  function setSize(s) {
    curSize = s;
    document.querySelectorAll('.size-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.s === s)
    );
    document.getElementById('tipPaper').textContent = TIP_PAPER[s] || '';
    rebuild();
  }

  function labelHTML(pid, cls) {
    const p = PRODS[pid];
    if (!p) return '';
    const qr      = QR_CACHE[pid];
    const showQr   = document.getElementById('chkQr').checked && qr;
    const showShop = document.getElementById('chkShop').checked;
    const showCat  = document.getElementById('chkCat').checked && p.cat;
    const showSku  = document.getElementById('chkSku').checked;
    const showMrp  = document.getElementById('chkMrp').checked;
    const price    = `NPR ${p.price % 1 === 0 ? p.price.toFixed(0) : p.price.toFixed(2)}`;

    // Horizontal layouts (s40, s50, sroll): QR on left, text on right
    const isHoriz = (cls === 's40' || cls === 's50' || cls === 'sroll');

    let qrPart  = showQr ? `<div class="l-qr"><img src="${qr}" alt="QR"></div>` : '';
    let textPart = `<div class="l-text">`;
    if (showShop) textPart += `<div class="l-shop">${SHOP}</div>`;
    textPart += `<div class="l-name">${p.name}</div>`;
    if (showCat)  textPart += `<div class="l-cat">${p.cat}</div>`;
    textPart += `<div class="l-price">${price}</div>`;
    if (showMrp)  textPart += `<div class="l-mrp">MRP incl. taxes</div>`;
    if (showSku)  textPart += `<div class="l-sku">${p.sku}</div>`;
    textPart += `</div>`;

    const inner = isHoriz ? qrPart + textPart : textPart + qrPart;
    return `<div class="label ${cls}">${inner}</div>`;
  }

  function rebuild() {
    const cbs = document.querySelectorAll('.pcb:checked');
    let html = '', total = 0;
    cbs.forEach(cb => {
      const pid = parseInt(cb.value);
      const copies = Math.max(1, parseInt(
        document.querySelector(`.qty-inp[data-pid="${pid}"]`)?.value || 1
      ));
      for (let i = 0; i < copies; i++) html += labelHTML(pid, curSize);
      total += copies;
    });
    document.getElementById('previewSheet').innerHTML = html;
    document.getElementById('printSheet').innerHTML   = html;
    document.getElementById('cntBadge').textContent =
      total + ' label' + (total !== 1 ? 's' : '');
  }

  function doPrint() {
    // Inject the correct @page size for the selected label
    let el = document.getElementById('dynPageCss');
    if (!el) {
      el = document.createElement('style');
      el.id = 'dynPageCss';
      document.head.appendChild(el);
    }
    el.textContent = PAGE_CSS[curSize] || PAGE_CSS['s50'];
    window.print();
  }

  async function loadQr(pid) {
    if (QR_CACHE[pid]) return;
    try {
      const r = await fetch(`/inventory/labels/qr?sku=${encodeURIComponent(PRODS[pid].sku)}`);
      if (r.ok) { const d = await r.json(); QR_CACHE[pid] = d.qr; }
    } catch(e) {}
  }

  function onCheck(cb) {
    if (cb.checked) {
      loadQr(parseInt(cb.value)).then(rebuild);
    }
    rebuild();
  }

  function selectAll() {
    const promises = [];
    document.querySelectorAll('.pcb').forEach(cb => {
      if (!cb.checked) { cb.checked = true; promises.push(loadQr(parseInt(cb.value))); }
    });
    Promise.all(promises).then(rebuild);
    rebuild();
  }

  function clearAll() {
    document.querySelectorAll('.pcb').forEach(cb => cb.checked = false);
    rebuild();
  }

  function filterProds() {
    const q = document.getElementById('prodSearch').value.toLowerCase();
    document.querySelectorAll('#prodList label').forEach(row => {
      row.style.display = (row.dataset.name.includes(q) || row.dataset.cat.includes(q)) ? '' : 'none';
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    setSize('s50');
    rebuild();
  });
</script>
</body>
</html>
