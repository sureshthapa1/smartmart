<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Labels</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background:#f1f5f9; font-family:'Segoe UI',Arial,sans-serif; }
    .topbar { background:#0f172a; padding:.6rem 1.2rem; color:#fff; display:flex; align-items:center; gap:1rem; }
    .topbar a { color:#94a3b8; text-decoration:none; font-size:.85rem; }
    .card2 { background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:1.4rem; margin-bottom:1.2rem; }
    .sbtn { border:2px solid #e2e8f0; border-radius:8px; padding:.3rem .75rem; cursor:pointer; font-size:.8rem; font-weight:600; background:#f8fafc; }
    .sbtn.on { border-color:#6366f1; background:#eef2ff; color:#6366f1; }
    .prow { border:1px solid #e2e8f0; border-radius:8px; padding:.4rem .75rem; margin-bottom:.3rem; display:flex; align-items:center; gap:.6rem; cursor:pointer; }
    .prow:hover { background:#f8fafc; }
    .qin { width:52px; border:1px solid #e2e8f0; border-radius:6px; padding:.15rem .35rem; font-size:.8rem; text-align:center; }
    #prevSheet { display:flex; flex-wrap:wrap; gap:3mm; padding:4mm; }
    .lbl { box-sizing:border-box; border:1.5px solid #333; background:#fff; font-family:Arial,sans-serif; display:flex; flex-direction:column; overflow:hidden; }
    .lbl.s50x25  { width:50mm;  height:25mm;  padding:1mm 1.5mm; }  /* ★ Your sticker */
    .lbl.s75x50  { width:75mm;  height:50mm;  padding:3mm 4mm; }
    .lbl.s50x30  { width:50mm;  height:30mm;  padding:2mm 3mm; }
    .lbl.s60x40  { width:60mm;  height:40mm;  padding:3mm; }
    .lbl.s100x50 { width:100mm; height:50mm;  padding:3mm 4mm; }
    .lbl .ltxt { flex:1; overflow:hidden; }
    .lbl .lshop  { font-size:7pt;  font-weight:700; color:#000; }
    .lbl .lname  { font-size:12pt; font-weight:900; color:#000; line-height:1.2; word-break:break-word; }
    .lbl .lprice { font-size:18pt; font-weight:900; color:#000; line-height:1.1; }
    .lbl .lmrp   { font-size:6pt;  color:#444; }
    .lbl .lsku   { font-size:6pt;  color:#444; }
    .lbl .lbc    { width:100%; margin-top:2mm; }
    .lbl .lbc img { width:100%; height:auto; display:block; image-rendering:crisp-edges; }
    @media print {
      body > * { display:none !important; }
      #printArea { display:block !important; }
      .plbl {
        display:flex; flex-direction:column;
        width:100%; height:100%;
        box-sizing:border-box; padding:2mm 3mm 1mm 3mm;
        background:#fff;
        -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important;
        page-break-after:always; break-after:page;
      }
      .plbl:last-child { page-break-after:avoid; break-after:avoid; }
      .plbl .ltxt  { flex:1; overflow:hidden; }
      .plbl .lshop { font-size:5.5pt; font-weight:700; color:#000 !important; }
      .plbl .lname { font-size:8pt;  font-weight:900; color:#000 !important; line-height:1.1; word-break:break-word; }
      .plbl .lprice{ font-size:11pt; font-weight:900; color:#000 !important; line-height:1.1; }
      .plbl .lmrp  { font-size:5pt;  color:#000 !important; }
      .plbl .lsku  { font-size:5pt;  color:#000 !important; }
      .plbl .lbc   { width:100%; margin-top:auto; padding-top:1mm; }
      .plbl .lbc img { width:100%; height:auto; display:block; image-rendering:crisp-edges; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
      /* @page size injected dynamically by injectPageCSS() before print */
    }
  </style>
</head>
<body>

<div class="topbar">
  <a href="{{ url_for('inventory.list_products') }}"><i class="bi bi-arrow-left me-1"></i>Inventory</a>
  <span style="font-weight:700;">Print Labels</span>
  <div class="ms-auto d-flex gap-2">
    <button id="btnPdf" onclick="downloadPDF()" class="btn btn-sm fw-semibold"
            style="background:#22c55e;color:#fff;border:none;border-radius:8px;padding:.35rem 1rem;">
      <i class="bi bi-file-earmark-pdf me-1"></i>Download PDF
    </button>
    <button onclick="printDirect()" class="btn btn-sm fw-semibold"
            style="background:#f59e0b;color:#fff;border:none;border-radius:8px;padding:.35rem 1rem;">
      <i class="bi bi-printer-fill me-1"></i>Print Direct
    </button>
  </div>
</div>

<div class="container-fluid py-3" style="max-width:1100px;">
  <div class="row g-3">

    <div class="col-lg-5">
      <div class="card2">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h6 class="fw-bold mb-0">Select Products</h6>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="selAll()">All</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="selNone()">None</button>
          </div>
        </div>
        <input type="text" id="srch" class="form-control form-control-sm mb-2" placeholder="Search…" oninput="filterList()">
        <div id="plist" style="max-height:430px;overflow-y:auto;">
          {% for p in products %}
          <label class="prow" data-n="{{ p.name|lower }}" data-c="{{ (p.category or '')|lower }}">
            <input type="checkbox" class="pcb" value="{{ p.id }}"
                   {% if p.id in selected_ids %}checked{% endif %}
                   onchange="onChk(this)">
            <div class="flex-grow-1">
              <div style="font-size:.82rem;font-weight:600;">{{ p.name }}</div>
              <div style="font-size:.7rem;color:#64748b;">{{ p.sku }} · NPR {{ "%.0f"|format(p.selling_price|float) }}</div>
            </div>
            <input type="number" class="qin" min="1" max="200" value="1"
                   title="Copies" onclick="event.stopPropagation()"
                   oninput="rebuild()" data-pid="{{ p.id }}">
          </label>
          {% endfor %}
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card2 mb-3">
        <h6 class="fw-bold mb-3">Options</h6>
        <div class="d-flex flex-wrap gap-2 mb-3">
          <span class="text-muted small fw-semibold align-self-center">Size:</span>
          <button class="sbtn on" data-s="s50x25" onclick="setSize('s50x25')">★ 50×25mm (Your sticker)</button>
          <button class="sbtn" data-s="s75x50"  onclick="setSize('s75x50')">75×50mm</button>
          <button class="sbtn" data-s="s50x30"  onclick="setSize('s50x30')">50×30mm</button>
          <button class="sbtn" data-s="s60x40"  onclick="setSize('s60x40')">60×40mm</button>
          <button class="sbtn" data-s="s100x50" onclick="setSize('s100x50')">100×50mm</button>
        </div>

        <div class="alert alert-success py-2 px-3 mb-3" style="font-size:.8rem;">
          <strong>✅ Recommended:</strong> Click <strong>Download PDF</strong> → open in PDF viewer →
          print with <strong>Actual Size, No margins</strong>.<br>
          <strong>⚡ Or:</strong> Click <strong>Print Direct</strong> to send straight to
          <em>sticker printer</em> — no dialog needed.
        </div>

        <div class="d-flex flex-wrap gap-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="chkBc" checked onchange="rebuild()">
            <label class="form-check-label small" for="chkBc">Barcode</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="chkShop" checked onchange="rebuild()">
            <label class="form-check-label small" for="chkShop">Shop name</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="chkMrp" checked onchange="rebuild()">
            <label class="form-check-label small" for="chkMrp">MRP line</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="chkSku" onchange="rebuild()">
            <label class="form-check-label small" for="chkSku">SKU</label>
          </div>
        </div>
      </div>

      <div class="card2">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h6 class="fw-bold mb-0">Preview <small class="text-muted fw-normal">(2× scale)</small></h6>
          <span id="cnt" class="badge bg-secondary">0 labels</span>
        </div>
        <div style="background:#e2e8f0;border-radius:8px;padding:6px;overflow:auto;max-height:420px;">
          <div id="prevSheet"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="printArea"><div id="printSheet"></div></div>

<script>
  const SHOP = {{ (shop.shop_name if shop else 'Smart Mart') | tojson }};
  const PRE_BC = {
    {% for item in label_data %}{{ item.id }}: {{ item.barcode_b64 | tojson }}{% if not loop.last %},{% endif %}{% endfor %}
  };
  const PRODS = {
    {% for p in products %}
    {{ p.id }}: { name:{{ p.name|tojson }}, sku:{{ p.sku|tojson }}, barcode:{{ (p.barcode or p.sku)|tojson }}, price:{{ p.selling_price|float }}, cat:{{ (p.category or '')|tojson }} }{% if not loop.last %},{% endif %}
    {% endfor %}
  };
  const BC = { ...PRE_BC };

  const SIZES = {
    s50x25:  { w:50,  h:25,  tip:'50 × 25 mm (Your sticker)' },
    s75x50:  { w:75,  h:50,  tip:'75 × 50 mm'  },
    s50x30:  { w:50,  h:30,  tip:'50 × 30 mm'  },
    s60x40:  { w:60,  h:40,  tip:'60 × 40 mm'  },
    s100x50: { w:100, h:50,  tip:'100 × 50 mm' },
  };
  let cur = 's50x25';  // default to user's 50×25mm sticker

  function injectPageCSS(s) {
    const dim = SIZES[s] || SIZES['s50x25'];
    const css = `@media print { @page { size: ${dim.w}mm ${dim.h}mm; margin: 0; } }`;
    let el = document.getElementById('dynPage');
    if (!el) { el = document.createElement('style'); el.id = 'dynPage'; document.head.appendChild(el); }
    el.textContent = css;
  }

  function setSize(s) {
    cur = s;
    document.querySelectorAll('.sbtn').forEach(b => b.classList.toggle('on', b.dataset.s === s));
    injectPageCSS(s);
    rebuild();
  }

  function labelInner(pid) {
    const p = PRODS[pid]; if (!p) return '';
    const showBc  = document.getElementById('chkBc').checked && BC[pid];
    const showShp = document.getElementById('chkShop').checked;
    const showMrp = document.getElementById('chkMrp').checked;
    const showSku = document.getElementById('chkSku').checked;
    const price   = 'NPR ' + (p.price % 1 === 0 ? p.price.toFixed(0) : p.price.toFixed(2));
    let txt = '<div class="ltxt">';
    if (showShp) txt += `<div class="lshop">${SHOP}</div>`;
    txt += `<div class="lname">${p.name}</div>`;
    txt += `<div class="lprice">${price}</div>`;
    if (showMrp) txt += `<div class="lmrp">MRP incl. all taxes</div>`;
    if (showSku) txt += `<div class="lsku">${p.sku}</div>`;
    txt += '</div>';
    const bcPart = showBc ? `<div class="lbc"><img src="${BC[pid]}" alt="barcode"></div>` : '';
    return txt + bcPart;
  }

  function rebuild() {
    const cbs = document.querySelectorAll('.pcb:checked');
    let prev='', print='', total=0;
    cbs.forEach(cb => {
      const pid = parseInt(cb.value);
      const n   = Math.max(1, parseInt(document.querySelector(`.qin[data-pid="${pid}"]`)?.value||1));
      const inn = labelInner(pid);
      for (let i=0;i<n;i++) {
        prev  += `<div class="lbl ${cur}">${inn}</div>`;
        print += `<div class="plbl">${inn}</div>`;
      }
      total += n;
    });
    document.getElementById('prevSheet').innerHTML  = prev;
    document.getElementById('printSheet').innerHTML = print;
    document.getElementById('cnt').textContent = total + (total===1?' label':' labels');
  }

  function buildPayload() {
    const items = [];
    document.querySelectorAll('.pcb:checked').forEach(cb => {
      const pid = parseInt(cb.value);
      const p   = PRODS[pid]; if (!p) return;
      const n   = Math.max(1, parseInt(document.querySelector(`.qin[data-pid="${pid}"]`)?.value||1));
      items.push({ pid, name:p.name, sku:p.sku, barcode:p.barcode||p.sku, price:p.price, copies:n });
    });
    return { items,
      w_mm: SIZES[cur].w, h_mm: SIZES[cur].h,
      show_barcode: document.getElementById('chkBc').checked,
      show_shop:    document.getElementById('chkShop').checked,
      show_mrp:     document.getElementById('chkMrp').checked,
      show_sku:     document.getElementById('chkSku').checked,
    };
  }

  async function downloadPDF() {
    const payload = buildPayload();
    if (!payload.items.length) { alert('Select at least one product.'); return; }
    const btn = document.getElementById('btnPdf');
    btn.disabled=true; btn.textContent='⏳ Generating…';
    try {
      const r = await fetch('/inventory/labels/pdf', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.content || ''
        },
        body: JSON.stringify(payload)
      });
      if (!r.ok) { alert('PDF failed: ' + await r.text()); return; }
      const blob = await r.blob();
      window.open(URL.createObjectURL(blob), '_blank');
    } catch(e) { alert('Error: '+e.message); }
    finally { btn.disabled=false; btn.innerHTML='<i class="bi bi-file-earmark-pdf me-1"></i>Download PDF'; }
  }

  async function printDirect() {
    const payload = buildPayload();
    if (!payload.items.length) { alert('Select at least one product.'); return; }
    payload.printer = 'sticker printer';
    try {
      const r = await fetch('/inventory/labels/print-direct', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.content || ''
        },
        body: JSON.stringify(payload)
      });
      const d = await r.json();
      if (d.ok) { alert(`✅ Sent ${d.printed} label(s) to sticker printer.`); }
      else { alert('Print failed: ' + (d.error||'unknown error')); }
    } catch(e) { alert('Error: '+e.message); }
  }

  async function loadBc(pid) {
    if (BC[pid]) return;
    try {
      const v = encodeURIComponent(PRODS[pid].barcode||PRODS[pid].sku);
      const r = await fetch(`/inventory/labels/barcode?value=${v}`);
      if (r.ok) { const d=await r.json(); BC[pid]=d.barcode; }
    } catch(e) {}
  }

  function onChk(cb) {
    if (cb.checked) loadBc(parseInt(cb.value)).then(rebuild); else rebuild();
  }
  function selAll() {
    const ps=[];
    document.querySelectorAll('.pcb').forEach(cb=>{ if(!cb.checked){cb.checked=true;ps.push(loadBc(parseInt(cb.value)));} });
    Promise.all(ps).then(rebuild);
  }
  function selNone() { document.querySelectorAll('.pcb').forEach(cb=>cb.checked=false); rebuild(); }
  function filterList() {
    const q=document.getElementById('srch').value.toLowerCase();
    document.querySelectorAll('#plist label').forEach(r=>{
      r.style.display=(r.dataset.n.includes(q)||r.dataset.c.includes(q))?'':'none';
    });
  }
  document.addEventListener('DOMContentLoaded', ()=>{ setSize('s75x50'); });
</script>
</body>
</html>
